<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Exposure | CMU Learning Health System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
        <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold text-xl shrink-0">C</div>
                <h1 class="text-xl font-bold text-gray-900 truncate">CMU Learning Health System</h1>
            </div>

        </div>
    </header>
    <div class="app-shell">

        <aside class="section-nav" aria-label="Report sections">
            <div class="section-nav-heading"><span>REPORT</span><span aria-hidden="true"></span></div>
            <nav class="section-nav-links">
                <a class="section-nav-link is-active" href="main.html" aria-current="page">
                    <span class="material-symbols-rounded" aria-hidden="true">air</span>
                    <span>Environmental Exposure</span>
                </a>
                <a class="section-nav-link" href="clinical-outreach.html">
                    <span class="material-symbols-rounded" aria-hidden="true">health_and_safety</span>
                    <span>Clinical Outreach &amp; Vulnerability Management</span>
                </a>
                <a class="section-nav-link" href="clinical-parameter-assessment.html">
                    <span class="material-symbols-rounded" aria-hidden="true">tune</span>
                    <span>Clinical Parameter Assessment</span>
                </a>
            </nav>
        </aside>
        <main class="page-main">
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="mb-6">
                <!-- Row 1: Section Name -->
                <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2 mb-4">
                    <span class="bg-blue-100 text-blue-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span>
                    Environmental Exposure
                </h2>
                
                <!-- Row 2: Controls (Location, Date Range & Toggles) -->
                <div class="flex flex-wrap items-center gap-3">
                    
                    <!-- Province / Amphoe / Tambon Selector Group -->
                    <div class="location-picker flex items-center bg-gray-50 border border-gray-300 rounded-lg p-1.5 px-3 space-x-2 shadow-sm">
                        <select id="province-select" onchange="updateLocationDropdowns('province')" class="bg-transparent text-gray-600 text-sm focus:outline-none cursor-pointer">
                            <!-- Populated via JS -->
                        </select>
                        <span class="text-gray-300">/</span>
                        <select id="amphoe-select" onchange="updateLocationDropdowns('amphoe')" class="bg-transparent text-gray-600 text-sm focus:outline-none cursor-pointer">
                            <!-- Populated via JS -->
                        </select>
                        <span class="text-gray-300">/</span>
                        <select id="location-select" onchange="fetchDashboardData()" class="bg-transparent text-gray-900 text-sm font-bold focus:outline-none cursor-pointer">
                            <!-- Populated via JS -->
                        </select>
                    </div>

                    <!-- Date Range -->
                    <div class="date-picker flex items-center space-x-2 bg-gray-50 border border-gray-300 rounded-lg p-1.5 px-3 shadow-sm">
                        <input type="date" id="start-date" onchange="fetchDashboardData()" class="bg-transparent text-sm text-gray-700 outline-none cursor-pointer" value="2026-04-10">
                        <span class="text-gray-400">-</span>
                        <input type="date" id="end-date" onchange="fetchDashboardData()" class="bg-transparent text-sm text-gray-700 outline-none cursor-pointer" value="2026-05-10">
                    </div>

                    <!-- Trend Buttons -->
                    <div class="inline-flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btn-daily" class="px-5 py-2 text-sm font-medium text-blue-700 bg-blue-50 border border-gray-200 rounded-l-lg hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">
                            Daily Trend
                        </button>
                        <button type="button" id="btn-weekly" class="px-5 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-r-md hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">
                            Weekly Trend
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chart Container -->
            <div class="relative w-full h-[350px]">
                <canvas id="envChart"></canvas>
            </div>
            <div class="flex justify-center gap-6 mt-4 text-xs text-gray-500">
                <div class="flex items-center gap-1">
                    <span class="w-3 h-3 rounded-full bg-[#ef4444]"></span> Critical PM2.5 (≥150)
                </div>
                <div class="flex items-center gap-1">
                    <span class="w-3 h-3 rounded-full bg-[#f97316]"></span> Extreme Heat (≥38°C)
                </div>
            </div>

            <!-- Real-time Local Stations Container -->
            <div class="mt-8 border-t border-gray-100 pt-6">
                <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <span>📡</span> Local Station Readings
                </h3>
                <div id="local-stations-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
        </section>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
